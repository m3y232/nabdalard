<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eee7;--sf:#f7f9f5;--tx:#1b2326;--mu:#58656a;--ln:#c9d3c8;--ac:#b57a12;--bl:#2b7a8c;--h1:#d9c9a3;--h2:#c4a97a;--h3:#a98a64;--h4:#7f6a52;--h5:#4f4a40;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--sf:#1b2426;--tx:#e8eee9;--mu:#9aa9ab;--ln:#2e3b3d;--ac:#e0a94a;--bl:#6bc0d2;--h1:#5a5040;--h2:#4a4236;--h3:#3d372e;--h4:#312d26;--h5:#26231f}}
:root[data-theme="dark"]{--bg:#121819;--sf:#1b2426;--tx:#e8eee9;--mu:#9aa9ab;--ln:#2e3b3d;--ac:#e0a94a;--bl:#6bc0d2;--h1:#5a5040;--h2:#4a4236;--h3:#3d372e;--h4:#312d26;--h5:#26231f}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Cairo,sans-serif;line-height:1.8;font-size:16px}
h1,h2,h3,button,.chip{font-family:Cairo,Tajawal,sans-serif}
.hero{background:linear-gradient(var(--h1) 0 18%,var(--h2) 18% 38%,var(--h3) 38% 58%,var(--h4) 58% 80%,var(--h5) 80%);padding:28px 16px 56px;position:relative}
.hero-in{max-width:760px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--tx)}
.top small{font-weight:600;opacity:.8}
#theme{background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:20px;padding:4px 12px;cursor:pointer}
h1{font-weight:900;font-size:clamp(2.4rem,9vw,4rem);line-height:1.2;margin-top:22px;color:var(--tx)}
.en{font-weight:600;color:var(--tx);opacity:.75;letter-spacing:.04em;direction:ltr;text-align:right}
.tag{font-size:1.15rem;margin-top:6px;color:var(--tx);font-weight:500}
.sbox{position:relative;margin-top:26px}
#q{width:100%;padding:15px 18px;font:600 1.05rem Cairo,sans-serif;border-radius:14px;border:2px solid var(--tx);background:var(--sf);color:var(--tx)}
#q:focus{outline:3px solid var(--bl);outline-offset:2px}
#sug{position:absolute;inset-inline:0;top:100%;background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-top:6px;z-index:5;overflow:hidden;display:none;box-shadow:0 8px 24px #0003}
#sug button{display:block;width:100%;text-align:start;padding:10px 16px;border:0;background:none;color:var(--tx);font:500 .95rem Cairo;cursor:pointer;border-bottom:1px solid var(--ln)}
#sug button:hover,#sug button:focus{background:var(--bg)}
main{max-width:1000px;margin:-30px auto 0;padding:0 14px 40px;position:relative}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:5px 12px;border-radius:20px;font-size:.88rem;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ex{font-size:.85rem;color:var(--mu);margin-top:10px}
.ex button{background:none;border:0;border-bottom:1px dashed var(--bl);color:var(--bl);cursor:pointer;font:inherit;margin:0 4px 0 0}
#ai{margin-top:14px;border-inline-start:5px solid var(--bl);display:none}
#ai h2{font-size:1.05rem;color:var(--bl)}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bl);margin:0 2px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px)}}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.88rem;margin:18px 2px 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-inline-start:5px solid var(--cc);border-radius:10px;padding:14px;cursor:pointer}
.card:focus-visible{outline:3px solid var(--bl)}
.card .c{font-size:.8rem;color:var(--mu);font-weight:600}
.card h3{font-size:1.08rem;margin:2px 0 6px;line-height:1.5}
.card p{font-size:.93rem;color:var(--mu)}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--ln);font-size:.93rem}
.more b{color:var(--ac)}
.card.open .more{display:block}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.78rem;font-weight:700}
.cf{background:var(--bl);color:var(--bg);padding:1px 9px;border-radius:12px}
.rel{color:var(--ac)}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
footer{text-align:center;color:var(--mu);font-size:.82rem;padding:0 16px 28px}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>

<script>
const CATS=[{id:'geo',n:'الصخور والتربة والجيولوجيا',i:'⛰️',c:'#a98a64'},{id:'sky',n:'السحب والطقس',i:'☁️',c:'#6b8fb5'},{id:'wat',n:'المياه والبحار والسيول',i:'🌊',c:'#2b7a8c'},{id:'ast',n:'الفلك والسماء',i:'🌙',c:'#7a6bb5'},{id:'plt',n:'النباتات والأشجار',i:'🌿',c:'#5b9a4a'},{id:'ani',n:'الحيوان والطيور',i:'🐦',c:'#c0762f'}];
// r: موثوقية علمية 1-3 | الحقول قابلة للتحميل من ملف JSON خارجي عبر loadEntries()
const RAW=[
{c:'geo',t:'تشققات صخرية متوازية (الفواصل)',k:'صخور شقوق تشقق فواصل تكتونية ضغط تصدع',s:'شقوق عمودية متوازية تقطع الصخر على مسافات منتظمة.',m:'تدل على إجهاد تكتوني أو تمدد وانكماش حراري. وهي مسارات لتسرب المياه الجوفية وتؤثر في ثبات المنحدرات.',x:'تنشأ الفواصل (Joints) عند تجاوز إجهاد الشد مقاومة الصخر دون إزاحة ملحوظة، بخلاف الصدوع.',r:3},
{c:'geo',t:'طبقات رسوبية متعاقبة',k:'طبقات رسوبية صخور ترسيب حجر رملي جيري طين عصور',s:'نطاقات أفقية بألوان وسماكات مختلفة في جدار جبل أو وادٍ.',m:'كل طبقة تسجل بيئة ترسيب قديمة: بحر، نهر، صحراء أو بحيرة. السفلى أقدم من العليا ما لم تنقلب.',x:'قانون التراكب (Superposition) أساس تأريخ الصخور نسبياً. تغير سماكة الطبقة يعكس معدل الترسيب.',r:3},
{c:'geo',t:'تربة حمراء',k:'تربة حمراء حديد اكاسيد لاتريت تجوية مناخ رطب',s:'تربة بلون أحمر أو برتقالي في سطح الأرض أو جوانب الطرق.',m:'غنية بأكاسيد الحديد، وغالباً تكونت في مناخ حار رطب مع تجوية شديدة، وقد تكون فقيرة بالمغذيات.',x:'التجوية الكيميائية تغسل السيليكا والقواعد وتترك الحديد والألومنيوم (لاتريت).',r:3},
{c:'geo',t:'أحافير بحرية في الجبال',k:'احافير محار بحر جبال ارتفاع تكتونية صخور',s:'أصداف أو آثار كائنات بحرية داخل صخور على ارتفاعات عالية.',m:'المنطقة كانت قاعاً بحرياً ثم ارتفعت بفعل حركة الصفائح التكتونية عبر ملايين السنين.',x:'تصادم الصفائح يرفع الرسوبيات البحرية. وُجدت أحافير بحرية حتى في قمم الهيمالايا.',r:3},
{c:'sky',t:'سحب ركامية مزنية رمادية داكنة',k:'سحب ركامية مزنية رمادي داكن اسود رعد برق عاصفة مطر غزير برد غيم',s:'سحب ضخمة قاعدتها داكنة وقمتها ترتفع كالسندان.',m:'عاصفة رعدية قريبة: أمطار غزيرة ورياح هابطة وبرق، وقد يصاحبها برد. ابتعد عن الأودية والأماكن المكشوفة.',x:'السحب الركامية المزنية (Cumulonimbus) تتكون بتيارات صاعدة قوية وقد يصل ارتفاعها إلى أكثر من 12 كم.',r:3},
{c:'sky',t:'سحب ريشية رقيقة عالية',k:'سحب ريشية رقيقة عالية خيوط جبهة دافئة تغير طقس غيم',s:'خيوط بيضاء ناعمة عالية في السماء تشبه الريش.',m:'قد تسبق جبهة دافئة، وغالباً يتغير الطقس خلال يوم إلى يومين مع زيادة الغيوم والرطوبة.',x:'تتكون من بلورات جليد على ارتفاع 6 إلى 12 كم. وجودها وحدها ليس مؤكداً للمطر.',r:2},
{c:'sky',t:'هالة حول القمر أو الشمس',k:'هالة قمر شمس حلقة دائرة بلورات جليد مطر',s:'حلقة مضيئة بنصف قطر نحو 22 درجة حول القمر أو الشمس.',m:'تعني وجود سحب ريشية طبقية عالية، وقد تتقدم نظاماً مطرياً في بعض الأحيان.',x:'ينكسر الضوء في بلورات جليد سداسية فينتج الهالة بزاوية 22 درجة.',r:2},
{c:'sky',t:'سحب عدسية قرب الجبال',k:'سحب عدسية جبال رياح قوية اضطراب طائرة غيم',s:'سحب ملساء بشكل عدسة أو طبق طائر ثابتة فوق القمم.',m:'رياح قوية على الارتفاعات مع موجات جبلية واضطراب جوي خطر على الطيران.',x:'تتكون في قمم موجات الهواء الراكدة خلف الحواجز الجبلية (Lee waves).',r:3},
{c:'wat',t:'علامات قرب السيل',k:'سيل سيول وادي فيضان مجرى مياه عكر دوي رعد امطار غزيرة خطر',s:'ماء عكر يرتفع فجأة، حطام وأغصان تطفو، صوت دوي من بعيد، أو غيوم رعدية فوق المرتفعات رغم صفاء السماء محلياً.',m:'خطر سيل مفاجئ قادم من منطقة المنبع. ابتعد عن مجرى الوادي فوراً واصعد إلى مكان مرتفع.',x:'الفيضانات الخاطفة (Flash floods) تنتقل عشرات الكيلومترات من موقع المطر خلال دقائق إلى ساعات.',r:3},
{c:'wat',t:'تغير لون البحر (المد الأحمر)',k:'بحر لون احمر بني طحالب مد ماء اسماك نافقة',s:'بقع حمراء أو بنية في ماء البحر، وربما أسماك نافقة.',m:'ازدهار طحالب مجهرية قد تفرز سموماً. تجنب السباحة وأكل المحار والأسماك من المنطقة.',x:'الازدهار الطحلبي الضار (HAB) يرتبط بالمغذيات ودفء الماء وركود التيارات.',r:3},
{c:'wat',t:'انحسار البحر المفاجئ',k:'بحر انحسار جزر تسونامي زلزال موجة ساحل',s:'تراجع كبير وسريع للماء عن الشاطئ دون سبب معتاد.',m:'قد يكون إنذاراً بتسونامي بعد زلزال. اصعد إلى مرتفع بعيداً عن الساحل فوراً ولا تنتظر الموجة.',x:'قد يسبق قاع الموجة قمتها. التسونامي سلسلة موجات وقد تتأخر الأخطر منها.',r:3},
{c:'wat',t:'ارتفاع مفاجئ في ماء بئر أو نبع',k:'بئر نبع ينبوع ماء جوفي ارتفاع منسوب امطار',s:'زيادة سريعة في منسوب البئر أو غزارة النبع.',m:'تغذية جوفية بعد أمطار غزيرة بعيدة أو ذوبان ثلوج، وقد تسبق وصول السيل في الأودية.',x:'تستجيب طبقات الصخور الكارستية للأمطار بسرعة أكبر من الرمال والطين.',r:2},
{c:'ast',t:'القمر الدموي (الخسوف الكلي)',k:'قمر احمر دموي خسوف ظل الارض',s:'قمر بلون أحمر نحاسي أثناء الخسوف الكلي.',m:'ظاهرة فلكية آمنة ومتوقعة بدقة، لا علاقة لها بالكوارث الأرضية.',x:'يمر ضوء الشمس عبر جو الأرض فيتشتت الأزرق ويصل الأحمر إلى القمر بالانكسار.',r:3},
{c:'ast',t:'تلألؤ النجوم الشديد',k:'نجوم تلالؤ وميض اضطراب جوي رياح رؤية',s:'نجوم تومض بقوة وتتغير ألوانها قرب الأفق.',m:'اضطراب في طبقات الجو العليا، وقد يرافقه رياح عالية الارتفاع. يسوء رصد الفلك في هذه الليالي.',x:'يسمى التلألؤ (Scintillation) ويحدث لتغير معامل انكسار الهواء بين طبقات مختلفة الحرارة.',r:2},
{c:'ast',t:'زخات الشهب',k:'شهب نيازك زخة مذنب حطام شهاب سماء ليل',s:'خطوط ضوء سريعة تتكرر في ليالي محددة من السنة.',m:'الأرض تعبر مسار حطام مذنب. مثال: البرشاويات في أغسطس والجباريات في أكتوبر.',x:'تحترق ذرات الغبار في الجو على ارتفاع نحو 100 كم بسرعات عشرات الكيلومترات في الثانية.',r:3},
{c:'ast',t:'شفق قطبي في عروض منخفضة',k:'شفق قطبي اضواء شمس عاصفة مغناطيسية سماء',s:'توهج أخضر أو أحمر في السماء بعيداً عن القطبين.',m:'عاصفة شمسية قوية تؤثر في المجال المغناطيسي، وقد تضطرب الاتصالات والأقمار الصناعية.',x:'جسيمات مشحونة تصطدم بذرات الأكسجين والنيتروجين في الغلاف الجوي العلوي.',r:3},
{c:'plt',t:'ذبول مفاجئ واصفرار الأوراق',k:'ذبول اصفرار اوراق نبات جفاف عطش نيتروجين تربة',s:'أوراق تذبل أو تصفر رغم موسم النمو.',m:'إجهاد مائي أو نقص نيتروجين أو أمراض جذرية. افحص الرطوبة والصرف أولاً.',x:'تفقد الأوراق الكلوروفيل عند نقص العناصر أو تلف الجذور فيظهر الأصفر.',r:3},
{c:'plt',t:'نباتات ملحية مثل الأثل',k:'نبات ملحية اثل ملوحة تربة سبخة ملح صحراء',s:'نمو كثيف لنباتات تتحمل الملح في أرض بيضاء القشرة.',m:'ملوحة عالية في التربة أو الماء الجوفي، وهي غير صالحة لأغلب المحاصيل دون معالجة.',x:'النباتات الملحية (Halophytes) تفرز الملح عبر الأوراق أو تخزنه في أنسجتها.',r:3},
{c:'plt',t:'نمو القصب والبردي',k:'قصب بردي نبات ماء قريب سطح رطوبة مستنقع',s:'تجمعات القصب في أرض تبدو جافة.',m:'ماء جوفي قريب من السطح أو تربة مشبعة موسمياً.',x:'تحتاج هذه النباتات إلى جذور مغمورة أو رطبة، فهي مؤشر حيوي لمستوى الماء.',r:3},
{c:'plt',t:'أشجار مائلة باتجاه واحد',k:'اشجار ميل رياح سائدة اتجاه تعرية',s:'أشجار وفروع منحنية كلها نحو اتجاه واحد.',m:'رياح سائدة قوية ومستمرة من الاتجاه المعاكس لميلها.',x:'يسمى الشكل العلمي (Flagging) وتستخدمه دراسات الرياح لتقدير شدة الرياح الطويلة.',r:3},
{c:'ani',t:'هجرة الطيور المبكرة',k:'طيور هجرة مبكرة برد شتاء مناخ',s:'أسراب تهاجر قبل موعدها المعتاد.',m:'قد تعكس تغير الطقس أو نقص الغذاء، وليست مؤشراً قاطعاً لوحدها.',x:'تتأثر الهجرة بطول النهار والحرارة والغذاء. تتغير توقيتاتها مع المناخ.',r:2},
{c:'ani',t:'السنونو يحلق منخفضاً',k:'سنونو طيور تحليق منخفض حشرات مطر ضغط رطوبة',s:'طيور تطير قريباً من الأرض أو الماء.',m:'قد يدل على اقتراب مطر لأن الحشرات تنخفض مع تغير الضغط والرطوبة.',x:'الارتباط ضعيف إلى متوسط. هو مؤشر شعبي صالح كقرينة مع علامات أخرى.',r:1},
{c:'ani',t:'سلوك غريب للحيوانات قبل الزلزال',k:'حيوانات سلوك غريب زلزال هزة كلاب قلق',s:'قلق وهروب أو صمت مفاجئ لدى الحيوانات.',m:'لا يوجد دليل علمي حاسم على التنبؤ بالزلازل بها. لا تعتمد عليه، وتابع الجهات الجيولوجية الرسمية.',x:'قد تحس بعض الحيوانات بموجات P الضعيفة قبل S بثوانٍ فقط، فلا يصلح ذلك للتنبؤ المسبق.',r:1},
{c:'ani',t:'نمل يهاجر بيضه إلى مكان مرتفع',k:'نمل عش بيض مطر رطوبة فيضان هجرة ارتفاع',s:'قوافل نمل تنقل البيض أو تبني أعشاشاً مرتفعة.',m:'استجابة لزيادة الرطوبة وتغير الضغط، وقد تسبق أمطاراً غزيرة محلياً.',x:'النمل حساس للرطوبة. الدلالة محلية وغير دقيقة بالتوقيت.',r:1}
];
const SYN={سيل:['وادي','فيضان','مطر','رعد'],سيول:['سيل','وادي'],غيم:['سحب'],سحاب:['سحب'],ريح:['رياح'],زلزال:['هزه','تكتون','تسونامي'],عاصفه:['رعد','ركاميه','برق'],مطر:['سحب','امطار','رطوبه'],ماء:['مياه','بئر','نبع'],بحر:['ساحل','موج'],تربه:['ارض','صخور'],طير:['طيور'],شفق:['شمس'],برد:['شتاء','جليد']};
const STOP=new Set('ماذا تعني تعنيه علامات علامه ما هو هي من في علي عن ذات لون قرب هل كيف متي الي او مع ذو بعض كل'.split(' '));
const norm=s=>s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[؟?!.,،:؛]/g,' ').toLowerCase();
const toks=q=>norm(q).split(/\s+/).map(w=>w.replace(/^(وال|بال|لل|ال)(?=.{2,})/,'')).filter(w=>w.length>1&&!STOP.has(w));
let DB=[];
function loadEntries(a){a.forEach(e=>{e.id=DB.length;e.nt=norm(e.t);e.nk=norm(e.k);e.ns=norm(e.s);e.nm=norm(e.m);e.nx=norm(e.x);DB.push(e)});stat()}
function search(q,cat){const T=toks(q);if(!T.length)return[];const ex=new Set(T);T.forEach(t=>(SYN[t]||[]).forEach(x=>ex.add(x)));
return DB.filter(e=>!cat||e.c===cat).map(e=>{let sc=0;ex.forEach(t=>{const w=T.includes(t)?1:.55;if(e.nt.includes(t))sc+=5*w;if(e.nk.includes(t))sc+=4*w;if(e.ns.includes(t))sc+=2*w;if(e.nm.includes(t))sc+=1.5*w;if(e.nx.includes(t))sc+=w});
return{e,conf:Math.min(98,Math.round(sc/(T.length*8)*100))}}).filter(o=>o.conf>0).sort((a,b)=>b.conf-a.conf)}
const $=id=>document.getElementById(id);let cat='',timer;
const cinfo=id=>CATS.find(c=>c.id===id);
const stars=r=>'●'.repeat(r)+'○'.repeat(3-r);
const rl=['','موثوقية علمية منخفضة','موثوقية علمية متوسطة','موثوقية علمية عالية'];
function stat(){$('stat').textContent=DB.length+' إشارة مفهرسة • جاهز لأكثر من 5000'}
function card(o){const e=o.e||o,ci=cinfo(e.c);return `<article class="card" tabindex="0" style="--cc:${ci.c}" data-id="${e.id}"><div class="c">${ci.i} ${ci.n}</div><h3>${e.t}</h3><p>${e.s}</p><div class="row">${o.conf?`<span class="cf">تطابق ${o.conf}%</span>`:''}<span class="rel" title="${rl[e.r]}">${stars(e.r)} ${rl[e.r]}</span></div><div class="more"><p><b>الدلالة:</b> ${e.m}</p><p style="margin-top:6px"><b>التفسير العلمي:</b> ${e.x}</p></div></article>`}
function render(){const q=$('q').value.trim();let list,ai=$('ai');
if(q){list=search(q,cat);$('mode').textContent='مرتبة حسب درجة التطابق'}else{list=DB.filter(e=>!cat||e.c===cat);$('mode').textContent='كل الإشارات'}
$('cnt').textContent=list.length+' نتيجة';
$('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة. جرّب كلمات أبسط مثل: سحب، صخور، رياح، سيل.</div>';
if(q){ai.style.display='block';ai.innerHTML='<h2>التحليل الذكي <span class="dots"><span></span><span></span><span></span></span></h2>';clearTimeout(timer);
timer=setTimeout(()=>{const t=list[0];ai.innerHTML=t?`<h2>التحليل الذكي</h2><p>أقرب تفسير لسؤالك «<span id="qq"></span>» هو <b>${t.e.t}</b> بثقة ${t.conf}%.</p><p style="color:var(--mu)">${t.e.m}</p>`:`<h2>التحليل الذكي</h2><p>لم أجد إشارة مطابقة لسؤالك «<span id="qq"></span>».</p>`;const s=$('qq');if(s)s.textContent=q},450)}else ai.style.display='none'}
function sug(){const q=$('q').value.trim(),b=$('sug');if(q.length<2){b.style.display='none';return}
const r=search(q).slice(0,5);b.innerHTML=r.map(o=>`<button type="button" role="option">${o.e.t}</button>`).join('');b.style.display=r.length?'block':'none'}
$('sug').onclick=e=>{if(e.target.tagName=='BUTTON'){$('q').value=e.target.textContent;$('sug').style.display='none';render()}};
$('q').oninput=()=>{sug();render()};
$('grid').onclick=e=>{const c=e.target.closest('.card');if(c)c.classList.toggle('open')};
$('grid').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){const c=e.target.closest('.card');if(c){e.preventDefault();c.classList.toggle('open')}}};
document.addEventListener('click',e=>{if(!e.target.closest('.sbox'))$('sug').style.display='none'});
$('cats').innerHTML='<button class="chip" aria-pressed="true" data-c="">الكل</button>'+CATS.map(c=>`<button class="chip" aria-pressed="false" data-c="${c.id}">${c.i} ${c.n}</button>`).join('');
$('cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('exs').innerHTML=['علامات قرب السيل؟','ماذا تعني السحب ذات اللون الرمادي الداكن؟','رياح','صخور'].map(x=>`<button type="button">${x}</button>`).join('');
$('exs').onclick=e=>{if(e.target.tagName=='BUTTON'){$('q').value=e.target.textContent;render();$('ai').scrollIntoView({behavior:'smooth',block:'center'})}};
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
loadEntries(RAW);render();
</script>
</body>
</html>
