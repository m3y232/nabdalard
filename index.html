<script>
const CATS=[{id:'geo',n:'الصخور والتربة والجيولوجيا',i:'⛰️',c:'#a98a64'},{id:'sky',n:'السحب والطقس',i:'☁️',c:'#6b8fb5'},{id:'wat',n:'المياه والبحار والسيول',i:'🌊',c:'#2b7a8c'},{id:'ast',n:'الفلك والسماء',i:'🌙',c:'#7a6bb5'},{id:'plt',n:'النباتات والأشجار',i:'🌿',c:'#5b9a4a'},{id:'ani',n:'الحيوان والطيور',i:'🐦',c:'#c0762f'},{id:'vol',n:'البراكين والزلازل',i:'🌋',c:'#c0502f'},{id:'win',n:'المناخ والرياح',i:'🌬️',c:'#4a8fa8'},{id:'des',n:'الصحارى والكثبان',i:'🏜️',c:'#c9a24a'},{id:'mar',n:'المحيطات والأحياء البحرية',i:'🐠',c:'#1f6f9a'},{id:'ice',n:'الثلوج والجليد',i:'❄️',c:'#7fb4cc'},{id:'eco',n:'الغابات والنظم البيئية',i:'🌲',c:'#3f7f4a'},{id:'min',n:'المعادن والموارد',i:'💎',c:'#8a6bb5'},{id:'ins',n:'الحشرات والأحياء الدقيقة',i:'🐞',c:'#b5894a'}];
// r: موثوقية علمية 1-3 | الحقول قابلة للتحميل من ملف JSON خارجي عبر loadEntries()
const RAW=[
{c:'geo',t:'تشققات صخرية متوازية (الفواصل)',k:'صخور شقوق تشقق فواصل تكتونية ضغط تصدع',s:'شقوق عمودية متوازية تقطع الصخر على مسافات منتظمة.',m:'تدل على إجهاد تكتوني أو تمدد وانكماش حراري. وهي مسارات لتسرب المياه الجوفية وتؤثر في ثبات المنحدرات.',x:'تنشأ الفواصل (Joints) عند تجاوز إجهاد الشد مقاومة الصخر دون إزاحة ملحوظة، بخلاف الصدوع.',r:3},
{c:'geo',t:'طبقات رسوبية متعاقبة',k:'طبقات رسوبية صخور ترسيب حجر رملي جيري طين عصور',s:'نطاقات أفقية بألوان وسماكات مختلفة في جدار جبل أو وادٍ.',m:'كل طبقة تسجل بيئة ترسيب قديمة: بحر، نهر، صحراء أو بحيرة. السفلى أقدم من العليا ما لم تنقلب.',x:'قانون التراكب (Superposition) أساس تأريخ الصخور نسبياً. تغير سماكة الطبقة يعكس معدل الترسيب.',r:3},
{c:'geo',t:'تربة حمراء',k:'تربة حمراء حديد اكاسيد لاتريت تجوية مناخ رطب',s:'تربة بلون أحمر أو برتقالي في سطح الأرض أو جوانب الطرق.',m:'غنية بأكاسيد الحديد، وغالباً تكونت في مناخ حار رطب مع تجوية شديدة، وقد تكون فقيرة بالمغذيات.',x:'التجوية الكيميائية تغسل السيليكا والقواعد وتترك الحديد والألومنيوم (لاتريت).',r:3},
{c:'geo',t:'أحافير بحرية في الجبال',k:'احافير محار بحر جبال ارتفاع تكتونية صخور',s:'أصداف أو آثار كائنات بحرية داخل صخور على ارتفاعات عالية.',m:'المنطقة كانت قاعاً بحرياً ثم ارتفعت بفعل حركة الصفائح التكتونية عبر ملايين السنين.',x:'تصادم الصفائح يرفع الرسوبيات البحرية. وُجدت أحافير بحرية حتى في قمم الهيمالايا.',r:3},
{c:'sky',t:'سحب ركامية مزنية رمادية داكنة',k:'سحب ركامية مزنية رمادي داكن اسود رعد برق عاصفة مطر غزير برد غيم',s:'سحب ضخمة قاعدتها داكنة وقمتها ترتفع كالسندان.',m:'عاصفة رعدية قريبة: أمطار غزيرة ورياح هابطة وبرق، وقد يصاحبها برد. ابتعد عن الأودية والأماكن المكشوفة.',x:'السحب الركامية المزنية (Cumulonimbus) تتكون بتيارات صاعدة قوية وقد يصل ارتفاعها إلى أكثر من 12 كم.',r:3},
{c:'sky',t:'سحب ريشية رقيقة عالية',k:'سحب ريشية رقيقة عالية خيوط جبهة دافئة تغير طقس غيم',s:'خيوط بيضاء ناعمة عالية في السماء تشبه الريش.',m:'قد تسبق جبهة دافئة، وغالباً يتغير الطقس خلال يوم إلى يومين مع زيادة الغيوم والرطوبة.',x:'تتكون من بلورات جليد على ارتفاع 6 إلى 12 كم. وجودها وحدها ليس مؤكداً للمطر.',r:2},
{c:'sky',t:'هالة حول القمر أو الشمس',k:'هالة قمر شمس حلقة دائرة بلورات جليد مطر',s:'حلقة مضيئة بنصف قطر نحو 22 درجة حول القمر أو الشمس.',m:'تعني وجود سحب ريشية طبقية عالية، وقد تتقدم نظاماً مطرياً في بعض الأحيان.',x:'ينكسر الضوء في بلورات جليد سداسية فينتج الهالة بزاوية 22 درجة.',r:2},
{c:'sky',t:'سحب عدسية قرب الجبال',k:'سحب عدسية جبال رياح قوية اضطراب طائرة غيم',s:'سحب ملساء بشكل عدسة أو طبق طائر ثابتة فوق القمم.',m:'رياح قوية على الارتفاعات مع موجات جبلية واضطراب جوي خطر على الطيران.',x:'تتكون في قمم موجات الهواء الراكدة خلف الحواجز الجبلية (Lee waves).',r:3},
{c:'wat',t:'علامات قرب السيل',k:'سيل سيول وادي فيضان مجرى مياه عكر دوي رعد امطار غزيرة خطر',s:'ماء عكر يرتفع فجأة، حطام وأغصان تطفو، صوت دوي من بعيد، أو غيوم رعدية فوق المرتفعات رغم صفاء السماء محلياً.',m:'خطر سيل مفاجئ قادم من منطقة المنبع. ابتعد عن مجرى الوادي فوراً واصعد إلى مكان مرتفع.',x:'الفيضانات الخاطفة (Flash floods) تنتقل عشرات الكيلومترات من موقع المطر خلال دقائق إلى ساعات.',r:3},
{c:'wat',t:'تغير لون البحر (المد الأحمر)',k:'بحر لون احمر بني طحالب مد ماء اسماك نافقة',s:'بقع حمراء أو بنية في ماء البحر، وربما أسماك نافقة.',m:'ازدهار طحالب مجهرية قد تفرز سموماً. تجنب السباحة وأكل المحار والأسماك من المنطقة.',x:'الازدهار الطحلبي الضار (HAB) يرتبط بالمغذيات ودفء الماء وركود التيارات.',r:3},
{c:'wat',t:'انحسار البحر المفاجئ',k:'بحر انحسار جزر تسونامي زلزال موجة ساحل',s:'تراجع كبير وسريع للماء عن الشاطئ دون سبب معتاد.',m:'قد يكون إنذاراً بتسونامي بعد زلزال. اصعد إلى مرتفع بعيداً عن الساحل فوراً ولا تنتظر الموجة.',x:'قد يسبق قاع الموجة قمتها. التسونامي سلسلة موجات وقد تتأخر الأخطر منها.',r:3},
{c:'wat',t:'ارتفاع مفاجئ في ماء بئر أو نبع',k:'بئر نبع ينبوع ماء جوفي ارتفاع منسوب امطار',s:'زيادة سريعة في منسوب البئر أو غزارة النبع.',m:'تغذية جوفية بعد أمطار غزيرة بعيدة أو ذوبان ثلوج، وقد تسبق وصول السيل في الأودية.',x:'تستجيب طبقات الصخور الكارستية للأمطار بسرعة أكبر من الرمال والطين.',r:2},
{c:'ast',t:'القمر الدموي (الخسوف الكلي)',k:'قمر احمر دموي خسوف ظل الارض',s:'قمر بلون أحمر نحاسي أثناء الخسوف الكلي.',m:'ظاهرة فلكية آمنة ومتوقعة بدقة، لا علاقة لها بالكوارث الأرضية.',x:'يمر ضوء الشمس عبر جو الأرض فيتشتت الأزرق ويصل الأحمر إلى القمر بالانكسار.',r:3},
{c:'ast',t:'تلألؤ النجوم الشديد',k:'نجوم تلالؤ وميض اضطراب جوي رياح رؤية',s:'نجوم تومض بقوة وتتغير ألوانها قرب الأفق.',m:'اضطراب في طبقات الجو العليا، وقد يرافقه رياح عالية الارتفاع. يسوء رصد الفلك في هذه الليالي.',x:'يسمى التلألؤ (Scintillation) ويحدث لتغير معامل انكسار الهواء بين طبقات مختلفة الحرارة.',r:2},

function search(q,cat){const T=toks(q);if(!T.length)return[];const ex=new Set(T);T.forEach(t=>(SYN[t]||[]).forEach(x=>ex.add(x)));
